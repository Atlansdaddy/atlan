# The gate, enforced at the repository boundary.
#
# It already ran locally on every commit — but only where someone remembered to
# run it, which makes a 527-assertion suite an honour system. There is an outside
# contributor branch on this remote, so the boundary is not hypothetical.
#
# Deliberately NOT running the E2E suite: it makes real Claude calls and costs
# money. It stays opt-in behind RUN_PAID=1, per the note in test/run-all.mjs.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first — no point burning minutes on a commit
# that is already stale.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # tmux backs the PTY suite. pty.js degrades to a bare shell without it, so
      # its absence is not a crash — it is three silently-skipped assertions in
      # the Connection suite, which is worse.
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux

      - name: Install
        run: npm ci || npm install

      # Chromium only. The suite never drives Firefox or WebKit, and pulling all
      # three roughly triples this step.
      - name: Install Chromium for the browser specs
        run: npx playwright install --with-deps chromium

      # Fails the job on any non-zero suite. Every suite boots its own throwaway
      # server on a free port with its own temp state, so nothing here needs a
      # service container or a fixture database.
      - name: Run the gate
        run: node test/run-all.mjs

      # WHAT THIS RUNNER CANNOT VERIFY.
      #
      # There was a "receipts must match what was committed" step here. It was
      # wrong, and the way it was wrong matters more than the step did: it
      # assumed the suite produces identical output everywhere. It does not, by
      # design — the Security Spine suite SKIPS when the host cannot confine, and
      # a GitHub runner cannot (unprivileged uid_map writes are refused). Local:
      # 650 assertions. Here: 569, with 81 skipped.
      #
      # So a green badge from this job does NOT mean the sandbox was tested. It
      # means everything testable here passed. Saying that out loud in the log is
      # the honest version; a byte-comparison that fails for an unrelated reason
      # just hid it behind the wrong error.
      - name: Report what was skipped, and why
        if: always()
        run: |
          skipped=$(grep -c '⊘' docs/RECEIPTS.md || true)
          total=$(grep -oE '\*\*Total: [0-9]+ passed' docs/RECEIPTS.md | grep -oE '[0-9]+' || echo '?')
          echo "assertions passed here: $total"
          echo "assertions skipped:     $skipped"
          if [ "${skipped:-0}" -gt 0 ]; then
            echo "::warning::${skipped} assertions were SKIPPED on this runner — most are kernel-confinement checks that need unprivileged user namespaces. This job does NOT verify the OS sandbox. See docs/SECURITY-SPINE-REPORT.md."
            grep '⊘' docs/RECEIPTS.md | head -5
          fi

      - name: Upload receipts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: receipts
          path: docs/RECEIPTS.md
          if-no-files-found: ignore
